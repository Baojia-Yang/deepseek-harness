<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">同一段历史的三种继续方式</title>
  <desc id="desc">正常恢复沿用原 Session ID 并在完整历史后继续追加；Fork 从选定的已完成前缀创建新 Session ID，原会话保持不变；崩溃恢复沿用原 ID，先追加中断或工具结果未知的说明，再继续工作。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5F6370"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #303640; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #68707C; }
      .branch-title { font-size: 20px; font-weight: 700; }
      .node-copy { font-size: 15px; fill: #4B5360; }
      .small { font-size: 14px; fill: #5F6773; }
      .chip { font-size: 14px; font-weight: 700; }
      .inverse { fill: #FFFFFF; }
      .card { stroke: #6F7782; stroke-width: 1.4; }
      .edge { fill: none; stroke: #5F6370; stroke-width: 2.3; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #5F6370; stroke-width: 2.2; }
      .reference { fill: none; stroke: #5F6370; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#F5F7F9"/>
  <text class="title" x="52" y="50">同一段历史的三种继续方式</text>
  <text class="subtitle" x="52" y="76">Resume、Fork 和崩溃恢复共享历史前缀，但对身份、分支和中断事实的处理不同。</text>

  <rect x="32" y="104" width="1136" height="138" rx="20" fill="#FFFFFF" stroke="#D5DAE0" stroke-width="1.5"/>
  <text class="branch-title" x="58" y="142">共同起点</text>
  <rect x="250" y="130" width="170" height="66" rx="14" fill="#A9C9DC"/>
  <text class="chip" x="335" y="157" text-anchor="middle">Session ID · S</text>
  <text class="small" x="335" y="180" text-anchor="middle">稳定身份</text>
  <rect x="446" y="130" width="166" height="66" rx="14" fill="#5F6370"/>
  <text class="chip inverse" x="529" y="157" text-anchor="middle">历史 A</text>
  <text class="small inverse" x="529" y="180" text-anchor="middle">已完成</text>
  <rect x="624" y="130" width="166" height="66" rx="14" fill="#5F6370"/>
  <text class="chip inverse" x="707" y="157" text-anchor="middle">历史 B</text>
  <text class="small inverse" x="707" y="180" text-anchor="middle">已完成</text>
  <rect x="802" y="130" width="166" height="66" rx="14" fill="#5F6370"/>
  <text class="chip inverse" x="885" y="157" text-anchor="middle">历史 C</text>
  <text class="small inverse" x="885" y="180" text-anchor="middle">当前尾部</text>
  <path class="edge" d="M420 163 H438"/>
  <path class="edge" d="M612 163 H616"/>
  <path class="edge" d="M790 163 H794"/>

  <path class="branch" d="M600 242 V278 H211 V306"/>
  <path class="branch" d="M600 242 V306"/>
  <path class="branch" d="M600 242 V278 H989 V306"/>
  <circle cx="600" cy="278" r="5" fill="#5F6370"/>

  <rect class="card" x="42" y="306" width="338" height="310" rx="18" fill="#E7F2F8"/>
  <rect x="66" y="328" width="112" height="32" rx="16" fill="#A9C9DC"/>
  <text class="chip" x="122" y="350" text-anchor="middle">Resume</text>
  <text class="branch-title" x="66" y="395">沿用同一身份</text>
  <text class="node-copy" x="66" y="424">读取完整历史 A–C</text>
  <text class="node-copy" x="66" y="449">重建当前上下文</text>
  <text class="node-copy" x="66" y="474">继续写入同一个 Session S</text>
  <rect x="66" y="510" width="64" height="46" rx="10" fill="#5F6370"/>
  <text class="chip inverse" x="98" y="539" text-anchor="middle">A</text>
  <rect x="138" y="510" width="64" height="46" rx="10" fill="#5F6370"/>
  <text class="chip inverse" x="170" y="539" text-anchor="middle">B</text>
  <rect x="210" y="510" width="64" height="46" rx="10" fill="#5F6370"/>
  <text class="chip inverse" x="242" y="539" text-anchor="middle">C</text>
  <rect x="282" y="510" width="72" height="46" rx="10" fill="#9EDFD8"/>
  <text class="chip" x="318" y="539" text-anchor="middle">D</text>
  <text class="small" x="66" y="586">结果：S = A · B · C · D</text>

  <rect class="card" x="431" y="306" width="338" height="310" rx="18" fill="#FFF7E2"/>
  <rect x="455" y="328" width="94" height="32" rx="16" fill="#F4D58D"/>
  <text class="chip" x="502" y="350" text-anchor="middle">Fork</text>
  <text class="branch-title" x="455" y="395">从安全前缀创建新身份</text>
  <text class="node-copy" x="455" y="424">选择已经完成的历史 A–B</text>
  <text class="node-copy" x="455" y="449">创建新的 Session F</text>
  <text class="node-copy" x="455" y="474">父 Session S 保持 A–C 不变</text>
  <rect x="455" y="510" width="64" height="46" rx="10" fill="#5F6370"/>
  <text class="chip inverse" x="487" y="539" text-anchor="middle">A</text>
  <rect x="527" y="510" width="64" height="46" rx="10" fill="#5F6370"/>
  <text class="chip inverse" x="559" y="539" text-anchor="middle">B</text>
  <rect x="599" y="510" width="72" height="46" rx="10" fill="#F4D58D"/>
  <text class="chip" x="635" y="539" text-anchor="middle">D′</text>
  <rect x="679" y="510" width="64" height="46" rx="10" fill="#F4D58D"/>
  <text class="chip" x="711" y="539" text-anchor="middle">E′</text>
  <text class="small" x="455" y="586">结果：F = A · B · D′ · E′</text>

  <rect class="card" x="820" y="306" width="338" height="310" rx="18" fill="#FDECEA"/>
  <rect x="844" y="328" width="132" height="32" rx="16" fill="#F2A7A0"/>
  <text class="chip" x="910" y="350" text-anchor="middle">崩溃恢复</text>
  <text class="branch-title" x="844" y="395">先承认中断，再继续</text>
  <text class="node-copy" x="844" y="424">保留崩溃前已经记录的事实</text>
  <text class="node-copy" x="844" y="449">追加中断或结果未知说明</text>
  <text class="node-copy" x="844" y="474">继续写入原 Session S</text>
  <rect x="844" y="510" width="54" height="46" rx="10" fill="#5F6370"/>
  <text class="chip inverse" x="871" y="539" text-anchor="middle">A</text>
  <rect x="906" y="510" width="54" height="46" rx="10" fill="#5F6370"/>
  <text class="chip inverse" x="933" y="539" text-anchor="middle">B</text>
  <rect x="968" y="510" width="92" height="46" rx="10" fill="#F2A7A0"/>
  <text class="chip" x="1014" y="539" text-anchor="middle">Interrupted</text>
  <rect x="1068" y="510" width="64" height="46" rx="10" fill="#9EDFD8"/>
  <text class="chip" x="1100" y="539" text-anchor="middle">D</text>
  <text class="small" x="844" y="586">结果：S 如实包含中断</text>

  <rect x="42" y="642" width="1116" height="116" rx="18" fill="#FFFFFF" stroke="#D5DAE0" stroke-width="1.5"/>
  <text class="branch-title" x="66" y="678">崩溃恢复中的工具结果</text>
  <rect x="66" y="696" width="444" height="42" rx="12" fill="#FFF7E2"/>
  <text class="chip" x="288" y="722" text-anchor="middle">尚未开始执行 → 可以重新判断是否需要</text>
  <rect x="532" y="696" width="602" height="42" rx="12" fill="#FDECEA"/>
  <text class="chip" x="833" y="722" text-anchor="middle">已经开始但没有结果 → 结果未知，先验证外部状态</text>

  <text class="small" x="52" y="792">三种路径都不会自动回滚工作区文件。</text>
  <text class="small" x="1148" y="792" text-anchor="end">身份是否延续、历史是否分叉、中断是否显式，是三者的核心差别。</text>
</svg>
