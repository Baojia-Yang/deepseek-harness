<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">不同 Agent 系统的会话中心</title>
  <desc id="desc">DeepSeek Harness 以不可改写的会话事实日志为中心，并派生模型上下文、用户历史和产品状态。Claude Code 以 transcript 为中心，Codex 以 Thread、Turn 和 Item 为中心，OpenAI Agents SDK 以消息 items 集合为中心，LangGraph 以图状态 checkpoint 为中心。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5F6370"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #303640; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #68707C; }
      .column { font-size: 15px; font-weight: 700; fill: #5F6370; letter-spacing: 0.4px; }
      .system { font-size: 18px; font-weight: 700; }
      .node-title { font-size: 17px; font-weight: 700; }
      .node-copy { font-size: 14px; fill: #4B5360; }
      .small { font-size: 13px; fill: #5F6773; }
      .chip { font-size: 13px; font-weight: 700; }
      .inverse { fill: #FFFFFF; }
      .inverse-muted { fill: #EBEEF2; }
      .edge { fill: none; stroke: #5F6370; stroke-width: 2; marker-end: url(#arrow); }
      .card { stroke: #AAB1BA; stroke-width: 1.3; }
    </style>
  </defs>

  <rect width="1200" height="880" fill="#F5F7F9"/>
  <text class="title" x="52" y="50">相似的续聊能力，背后是不同的状态模型</text>
  <text class="subtitle" x="52" y="76">比较重点不是是否使用 JSONL，而是什么被视为会话中心，以及恢复时重建什么。</text>

  <text class="column" x="62" y="124">系统</text>
  <text class="column" x="258" y="124">会话中心</text>
  <text class="column" x="564" y="124">恢复的对象</text>
  <text class="column" x="812" y="124">从中心对象获得的能力</text>

  <rect x="32" y="140" width="1136" height="128" rx="18" fill="#FFFFFF" stroke="#5F6370" stroke-width="2"/>
  <rect x="52" y="158" width="174" height="92" rx="14" fill="#5F6370"/>
  <text class="system inverse" x="139" y="191" text-anchor="middle">DeepSeek</text>
  <text class="system inverse" x="139" y="215" text-anchor="middle">Harness</text>
  <text class="small inverse-muted" x="139" y="237" text-anchor="middle">事件日志中心</text>

  <rect class="card" x="250" y="158" width="258" height="92" rx="14" fill="#EEF1F4"/>
  <text class="node-title" x="274" y="190">Session Log</text>
  <text class="node-copy" x="274" y="215">不可改写的会话事实序列</text>
  <text class="small" x="274" y="237">消息、工具、状态与中断</text>

  <path class="edge" d="M508 204 H542"/>
  <rect class="card" x="550" y="158" width="208" height="92" rx="14" fill="#E7F2F8"/>
  <text class="node-title" x="574" y="190">完整 Session</text>
  <text class="node-copy" x="574" y="215">重放事实并修复中断</text>
  <text class="small" x="574" y="237">同一 ID 或历史分支</text>

  <path class="edge" d="M758 204 H792"/>
  <rect x="800" y="158" width="104" height="38" rx="12" fill="#9EDFD8"/>
  <text class="chip" x="852" y="182" text-anchor="middle">模型视图</text>
  <rect x="914" y="158" width="104" height="38" rx="12" fill="#A9C9DC"/>
  <text class="chip" x="966" y="182" text-anchor="middle">用户历史</text>
  <rect x="1028" y="158" width="116" height="38" rx="12" fill="#F4D58D"/>
  <text class="chip" x="1086" y="182" text-anchor="middle">产品状态</text>
  <text class="node-copy" x="800" y="222">Resume · Fork · 压缩</text>
  <text class="small" x="800" y="244">三种视图共享同一事实来源</text>

  <rect x="32" y="282" width="1136" height="108" rx="18" fill="#FFFFFF" stroke="#D5DAE0" stroke-width="1.5"/>
  <rect x="52" y="298" width="174" height="76" rx="14" fill="#E7F2F8"/>
  <text class="system" x="139" y="329" text-anchor="middle">Claude Code</text>
  <text class="small" x="139" y="352" text-anchor="middle">转录中心</text>
  <rect class="card" x="250" y="298" width="258" height="76" rx="14" fill="#EEF1F4"/>
  <text class="node-title" x="274" y="327">Transcript</text>
  <text class="node-copy" x="274" y="352">消息、工具与元数据记录</text>
  <path class="edge" d="M508 336 H542"/>
  <rect class="card" x="550" y="298" width="208" height="76" rx="14" fill="#EEF1F4"/>
  <text class="node-title" x="574" y="327">Conversation</text>
  <text class="node-copy" x="574" y="352">恢复完整对话</text>
  <path class="edge" d="M758 336 H792"/>
  <text class="node-copy" x="800" y="326">Resume · Branch · Rewind · Compact</text>
  <text class="small" x="800" y="352">文件 checkpoint 是配套但独立的机制</text>

  <rect x="32" y="404" width="1136" height="108" rx="18" fill="#FFFFFF" stroke="#D5DAE0" stroke-width="1.5"/>
  <rect x="52" y="420" width="174" height="76" rx="14" fill="#E6F6F3"/>
  <text class="system" x="139" y="451" text-anchor="middle">Codex</text>
  <text class="small" x="139" y="474" text-anchor="middle">Thread items 中心</text>
  <rect class="card" x="250" y="420" width="258" height="76" rx="14" fill="#EEF1F4"/>
  <text class="node-title" x="274" y="449">Thread · Turn · Item</text>
  <text class="node-copy" x="274" y="474">对话与 Agent 执行项目</text>
  <path class="edge" d="M508 458 H542"/>
  <rect class="card" x="550" y="420" width="208" height="76" rx="14" fill="#EEF1F4"/>
  <text class="node-title" x="574" y="449">Thread</text>
  <text class="node-copy" x="574" y="474">恢复 Turns 与活动状态</text>
  <path class="edge" d="M758 458 H792"/>
  <text class="node-copy" x="800" y="448">Resume · Fork · 分页 · 归档</text>
  <text class="small" x="800" y="474">压缩记录新的活动历史</text>

  <rect x="32" y="526" width="1136" height="108" rx="18" fill="#FFFFFF" stroke="#D5DAE0" stroke-width="1.5"/>
  <rect x="52" y="542" width="174" height="76" rx="14" fill="#FFF7E2"/>
  <text class="system" x="139" y="573" text-anchor="middle">OpenAI Agents SDK</text>
  <text class="small" x="139" y="596" text-anchor="middle">消息记忆中心</text>
  <rect class="card" x="250" y="542" width="258" height="76" rx="14" fill="#EEF1F4"/>
  <text class="node-title" x="274" y="571">Input items</text>
  <text class="node-copy" x="274" y="596">有序的模型对话历史</text>
  <path class="edge" d="M508 580 H542"/>
  <rect class="card" x="550" y="542" width="208" height="76" rx="14" fill="#EEF1F4"/>
  <text class="node-title" x="574" y="571">Session backend</text>
  <text class="node-copy" x="574" y="596">取回并追加历史 items</text>
  <path class="edge" d="M758 580 H792"/>
  <text class="node-copy" x="800" y="570">历史过滤 · 截断 · 清空 · 压缩</text>
  <text class="small" x="800" y="596">后端与策略由应用选择</text>

  <rect x="32" y="648" width="1136" height="108" rx="18" fill="#FFFFFF" stroke="#D5DAE0" stroke-width="1.5"/>
  <rect x="52" y="664" width="174" height="76" rx="14" fill="#FDECEA"/>
  <text class="system" x="139" y="695" text-anchor="middle">LangGraph</text>
  <text class="small" x="139" y="718" text-anchor="middle">状态快照中心</text>
  <rect class="card" x="250" y="664" width="258" height="76" rx="14" fill="#EEF1F4"/>
  <text class="node-title" x="274" y="693">Graph state checkpoint</text>
  <text class="node-copy" x="274" y="718">每个图步骤的状态快照</text>
  <path class="edge" d="M508 702 H542"/>
  <rect class="card" x="550" y="664" width="208" height="76" rx="14" fill="#EEF1F4"/>
  <text class="node-title" x="574" y="693">Checkpoint</text>
  <text class="node-copy" x="574" y="718">恢复计算状态与待执行节点</text>
  <path class="edge" d="M758 702 H792"/>
  <text class="node-copy" x="800" y="692">Resume · Time travel · Fork</text>
  <text class="small" x="800" y="718">状态机连续性是首要目标</text>

  <rect x="96" y="786" width="1008" height="56" rx="18" fill="#5F6370"/>
  <text class="inverse" x="600" y="811" text-anchor="middle" font-size="16" font-weight="700">DSH 的辨识度不在“保存聊天”，而在“会话事实与观察视图分离”</text>
  <text class="inverse-muted" x="600" y="832" text-anchor="middle" font-size="13">概念比较基于公开行为，不表示各系统的内部实现一一对应。</text>

  <text class="small" x="52" y="866">左到右：中心对象 → 恢复单位 → 用户可见能力</text>
  <text class="small" x="1148" y="866" text-anchor="end">同样的 Resume/Fork 名称，不代表相同的状态模型</text>
</svg>
