<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">插件与注册一同进入和退出</title>
  <desc id="desc">工具插件加载时向工具注册表注册能力，卸载时撤销自己的注册。Agent 下一次组装工具列表时读取当前可用工具。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#496277"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17324d; text-anchor: middle; }
      .title { font-size: 30px; font-weight: 700; text-anchor: start; }
      .label { font-size: 26px; font-weight: 600; }
      .copy { font-size: 24px; }
      .line { fill: none; stroke: #496277; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="640" height="560" rx="16" fill="#f6f8fb"/>
  <text class="title" x="32" y="52">插件与注册一同进入和退出</text>
  <rect x="32" y="88" width="576" height="76" rx="12" fill="#e5eef9" stroke="#7d9ebc"/>
  <text class="label" x="320" y="136">Agent 下一次组装工具列表</text>
  <path class="line" d="M320 208V174"/>
  <rect x="32" y="216" width="576" height="100" rx="12" fill="#ffffff" stroke="#7d9ebc"/>
  <text class="label" x="320" y="256">工具注册表</text>
  <text class="copy" x="320" y="293">当前可用工具</text>
  <path class="line" d="M162 348V326"/>
  <path d="M162 404V386" stroke="#496277" stroke-width="2.5" stroke-dasharray="5 5"/>
  <text class="copy" x="162" y="376">卸载：撤销注册</text>
  <path class="line" d="M478 348V326"/>
  <path d="M478 404V386" stroke="#496277" stroke-width="2.5"/>
  <text class="copy" x="478" y="376">加载：注册能力</text>
  <rect x="32" y="414" width="260" height="80" rx="12" fill="#fce9e3" stroke="#cb8875" stroke-dasharray="6 5"/>
  <text class="label" x="162" y="465">退出的工具插件</text>
  <rect x="348" y="414" width="260" height="80" rx="12" fill="#dff2ec" stroke="#6b9e90"/>
  <text class="label" x="478" y="465">加入的工具插件</text>
  <text class="copy" x="320" y="537">注册效果随插件生命周期管理</text>
</svg>
