<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">服务是否就绪，决定插件能否运行</title>
  <desc id="desc">以声明必需服务依赖的工具插件为例。第一阶段，必需服务尚未就绪，Consumer 等待激活，尚未产生注册。第二阶段，全部必需服务就绪，Consumer 激活并注册工具、监听器等能力。第三阶段，任一必需服务消失，Consumer 停用并撤销自身注册。下方回路表示必需服务恢复后可重新激活；它不保证运行中的任务无损恢复。阶段间箭头表示服务可用性变化，阶段内箭头表示服务条件决定 Consumer 状态。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#496277"/></marker>
    <marker id="red-arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#b86252"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17324d; }
      .title { font-size: 40px; font-weight: 700; }
      .label { font-size: 34px; font-weight: 600; }
      .copy { font-size: 30px; }
      .note { font-size: 26px; fill: #496277; }
      .flow { fill: none; stroke: #496277; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow); }
      .withdraw { fill: none; stroke: #b86252; stroke-width: 2.5; stroke-dasharray: 7 6; stroke-linejoin: round; marker-end: url(#red-arrow); }
    </style>
  </defs>
  <rect width="1400" height="590" fill="#fff"/>
  <text class="title" x="700" y="54" text-anchor="middle">服务是否就绪，决定插件能否运行</text>
  <text class="note" x="700" y="104" text-anchor="middle">以声明必需服务依赖的工具插件为例</text>

  <rect x="48" y="140" width="400" height="344" rx="16" fill="#fffbf2" stroke="#c6a55f" stroke-width="2"/>
  <text class="label" x="248" y="186" text-anchor="middle">① 等待依赖</text>
  <g data-node="service-pending">
    <rect x="72" y="214" width="352" height="76" rx="16" fill="#f5f8fc" stroke="#7d9ebc" stroke-width="2" stroke-dasharray="7 6"/>
    <text class="copy" x="248" y="264" text-anchor="middle">必需服务尚未就绪</text>
  </g>
  <path class="flow" d="M248 290V326"/>
  <g data-node="consumer-pending">
    <rect x="72" y="338" width="352" height="118" rx="16" fill="#fff3d6" stroke="#c6a55f" stroke-width="2"/>
    <text class="label" x="248" y="384" text-anchor="middle">Consumer</text>
    <text class="copy" x="248" y="436" text-anchor="middle">等待激活，尚未注册</text>
  </g>

  <path class="flow" d="M460 312H488"/>
  <rect x="500" y="140" width="400" height="344" rx="16" fill="#f5fbf8" stroke="#6b9e90" stroke-width="2"/>
  <text class="label" x="700" y="186" text-anchor="middle">② 激活插件</text>
  <g data-node="service-ready">
    <rect x="524" y="214" width="352" height="76" rx="16" fill="#e5eef9" stroke="#7d9ebc" stroke-width="2"/>
    <text class="copy" x="700" y="264" text-anchor="middle">全部必需服务就绪</text>
  </g>
  <path class="flow" d="M700 290V326"/>
  <g data-node="consumer-active">
    <rect x="524" y="338" width="352" height="118" rx="16" fill="#dff2ec" stroke="#6b9e90" stroke-width="2"/>
    <text class="label" x="700" y="384" text-anchor="middle">Consumer</text>
    <text class="copy" x="700" y="436" text-anchor="middle">激活并注册能力</text>
  </g>

  <path class="withdraw" d="M912 312H940"/>
  <rect x="952" y="140" width="400" height="344" rx="16" fill="#fff8f5" stroke="#cb8875" stroke-width="2"/>
  <text class="label" x="1152" y="186" text-anchor="middle">③ 停用插件</text>
  <g data-node="service-lost">
    <rect x="976" y="214" width="352" height="76" rx="16" fill="#f5f8fc" stroke="#7d9ebc" stroke-width="2" stroke-dasharray="7 6"/>
    <text class="copy" x="1152" y="264" text-anchor="middle">任一必需服务消失</text>
  </g>
  <path class="withdraw" d="M1152 290V326"/>
  <g data-node="consumer-inactive">
    <rect x="976" y="338" width="352" height="118" rx="16" fill="#fce9e3" stroke="#cb8875" stroke-width="2"/>
    <text class="label" x="1152" y="384" text-anchor="middle">Consumer</text>
    <text class="copy" x="1152" y="436" text-anchor="middle">停用并撤销注册</text>
  </g>

  <path class="flow" d="M1152 484V524H700V496"/>
  <text class="note" x="926" y="570" text-anchor="middle">必需服务恢复后，可重新激活</text>
</svg>
