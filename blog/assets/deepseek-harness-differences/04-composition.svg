<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="724" viewBox="0 0 1400 724" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">Profile 选择来源，Cordis 挂载插件</title>
  <desc id="desc">web Profile 依次选择 dsh-base 和 dsh-web-app 的 Bundle Patch，再叠加 Profile、Home 和本次启动的 Patch，生成配置并由 Cordis 加载。树中的 agent-loop、fs-sandbox 来自 Base，host-webserver、agent-presets 来自 Web App，它们可以同为根下节点；Bundle 是配置来源，不是必需的父节点。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#496277"/></marker>
    <marker id="red-arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#b86252"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17324d; }
      .title { font-size: 40px; font-weight: 700; }
      .label { font-size: 34px; font-weight: 600; }
      .copy { font-size: 30px; }
      .note { font-size: 26px; fill: #496277; }
      .small { font-size: 24px; fill: #496277; }
      .inverse { fill: #fff; }
      .node { font-size: 30px; }
      .node-small { font-size: 28px; }
      .flow { fill: none; stroke: #496277; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow); }
      .tree { fill: none; stroke: #496277; stroke-width: 2.5; stroke-linejoin: round; }
      .withdraw { fill: none; stroke: #b86252; stroke-width: 2.5; stroke-dasharray: 7 6; stroke-linejoin: round; marker-end: url(#red-arrow); }
      .expand { fill: none; stroke: #496277; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="724" fill="#fff"/>
  <text class="title" x="700" y="54" text-anchor="middle">Profile 选择来源，Cordis 挂载插件</text>
  <text class="note" x="700" y="100" text-anchor="middle">从配置来源，到实际挂载的节点</text>
  <g data-node="profile">
    <rect x="48" y="124" width="1304" height="64" rx="16" fill="#17324d" stroke="#17324d" stroke-width="2"/>
    <text class="label inverse" x="620" y="168" text-anchor="middle">Profile</text>
    <text class="label inverse" x="800" y="168" text-anchor="middle">web</text>
  </g>
  <path class="flow" d="M442 188V216"/>
  <rect x="48" y="228" width="788" height="164" rx="16" fill="#f6f8fb" stroke="#d7e1ec" stroke-width="2"/>
  <text class="copy" x="442" y="270" text-anchor="middle">Bundle Patch</text>
  <g data-node="base">
    <rect x="72" y="292" width="306" height="68" rx="16" fill="#fff" stroke="#7d9ebc" stroke-width="2"/>
    <text class="node" x="225" y="337" text-anchor="middle">① dsh-base</text>
  </g>
  <g data-node="web-app">
    <rect x="506" y="292" width="306" height="68" rx="16" fill="#e5eef9" stroke="#7d9ebc" stroke-width="2"/>
    <text class="node" x="659" y="337" text-anchor="middle">② dsh-web-app</text>
  </g>
  <path class="flow" d="M378 326H494"/>
  <path class="flow" d="M836 326H896"/>
  <g data-node="patch">
    <rect x="908" y="228" width="444" height="164" rx="16" fill="#fff2d9" stroke="#c3a668" stroke-width="2"/>
    <text class="label" x="1130" y="274" text-anchor="middle">用户 Patch</text>
    <text class="note" x="1130" y="324" text-anchor="middle">Profile → Home</text>
    <text class="note" x="1130" y="370" text-anchor="middle">→ 本次启动</text>
  </g>
  <rect x="48" y="450" width="1304" height="210" rx="16" fill="#fff" stroke="#d7e1ec" stroke-width="2"/>
  <path class="flow" d="M1130 392V424H700V458"/>
  <text class="small" x="1156" y="432" text-anchor="start">加载</text>
  <text class="label" x="250" y="492" text-anchor="middle">Plugin Tree</text>
  <text class="small" x="250" y="532" text-anchor="middle">最终配置交给 Cordis</text>
  <g data-node="root">
    <rect x="650" y="470" width="100" height="62" rx="16" fill="#17324d" stroke="#17324d" stroke-width="2"/>
    <text class="label inverse" x="700" y="514" text-anchor="middle">根</text>
  </g>
  <path class="tree" d="M700 532V560M220 584V560H1180V584M540 560V584M860 560V584"/>
  <g data-node="agent-loop">
    <rect x="76" y="584" width="288" height="56" rx="16" fill="#fff" stroke="#7d9ebc" stroke-width="2"/>
    <text class="node" x="220" y="622" text-anchor="middle">agent-loop</text>
  </g>
  <g data-node="fs-sandbox">
    <rect x="396" y="584" width="288" height="56" rx="16" fill="#fff" stroke="#7d9ebc" stroke-width="2"/>
    <text class="node" x="540" y="622" text-anchor="middle">fs-sandbox</text>
  </g>
  <g data-node="webserver">
    <rect x="716" y="584" width="288" height="56" rx="16" fill="#e5eef9" stroke="#7d9ebc" stroke-width="2"/>
    <text class="node-small" x="860" y="622" text-anchor="middle">host-webserver</text>
  </g>
  <g data-node="presets">
    <rect x="1036" y="584" width="288" height="56" rx="16" fill="#e5eef9" stroke="#7d9ebc" stroke-width="2"/>
    <text class="node" x="1180" y="622" text-anchor="middle">agent-presets</text>
  </g>
  <text class="note" x="700" y="704" text-anchor="middle">Bundle 是配置来源，不必成为树中的父节点</text>
</svg>
