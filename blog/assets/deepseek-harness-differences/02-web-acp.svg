<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">Web 与 ACP：改变应用面向谁</title>
  <desc id="desc">web 和 acp 各自包含公共运行插件，包括模型、Agent Loop、工具和 Session Log。web 增加 Web 服务、浏览器界面和 Agent Presets，面向浏览器用户；acp 增加标准输入输出上的 ACP 协议服务，面向自动化调用方。分组表示能力类别，不表示挂载层级或共同运行实例。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#496277"/></marker>
    <marker id="red-arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#b86252"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17324d; }
      .title { font-size: 40px; font-weight: 700; }
      .label { font-size: 34px; font-weight: 600; }
      .copy { font-size: 30px; }
      .note { font-size: 26px; fill: #496277; }
      .small { font-size: 24px; fill: #496277; }
      .inverse { fill: #fff; }
      .node { font-size: 30px; }
      .node-small { font-size: 28px; }
      .flow { fill: none; stroke: #496277; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow); }
      .tree { fill: none; stroke: #496277; stroke-width: 2.5; stroke-linejoin: round; }
      .withdraw { fill: none; stroke: #b86252; stroke-width: 2.5; stroke-dasharray: 7 6; stroke-linejoin: round; marker-end: url(#red-arrow); }
      .expand { fill: none; stroke: #496277; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="500" fill="#fff"/>
  <text class="title" x="700" y="54" text-anchor="middle">Web 与 ACP：改变应用面向谁</text>
  <text class="note" x="700" y="100" text-anchor="middle">复用公共能力，组合不同的应用入口</text>
  <rect x="48" y="130" width="632" height="282" rx="16" fill="#e5eef9" stroke="#7d9ebc" stroke-width="2" />
  <rect x="720" y="130" width="632" height="282" rx="16" fill="#e5eef9" stroke="#7d9ebc" stroke-width="2" />
  <text class="label" x="80" y="182" text-anchor="start">web</text>
  <text class="copy" x="648" y="180" text-anchor="end">浏览器用户</text>
  <text class="label" x="752" y="182" text-anchor="start">acp</text>
  <text class="copy" x="1320" y="180" text-anchor="end">自动化调用方</text>
  <g data-node="web-base">
  <rect x="80" y="212" width="568" height="64" rx="16" fill="#fff" stroke="#7d9ebc" stroke-width="2" />
  <text class="note" x="364" y="254" text-anchor="middle">模型 · Agent Loop · 工具 · Session Log</text>
  </g>
  <g data-node="acp-base">
  <rect x="752" y="212" width="568" height="64" rx="16" fill="#fff" stroke="#7d9ebc" stroke-width="2" />
  <text class="note" x="1036" y="254" text-anchor="middle">模型 · Agent Loop · 工具 · Session Log</text>
  </g>
  <g data-node="web-app">
  <rect x="80" y="294" width="568" height="100" rx="16" fill="#fff" stroke="#fff" stroke-width="2" />
  <text class="copy" x="364" y="336" text-anchor="middle">Web 服务 · 浏览器界面</text>
  <text class="note" x="364" y="380" text-anchor="middle">会话级 Agent Presets</text>
  </g>
  <g data-node="acp-app">
  <rect x="752" y="294" width="568" height="100" rx="16" fill="#fff" stroke="#fff" stroke-width="2" />
  <text class="copy" x="1036" y="336" text-anchor="middle">ACP 协议服务</text>
  <text class="note" x="1036" y="380" text-anchor="middle">标准输入输出 · 请求与会话更新</text>
  </g>
  <text class="note" x="700" y="470" text-anchor="middle">各自启动运行时；能力分组不表示插件父子关系</text>
</svg>
