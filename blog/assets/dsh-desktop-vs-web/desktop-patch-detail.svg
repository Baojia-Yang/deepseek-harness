<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">固定 Desktop Patch 主要修改什么</title>
  <desc id="desc">官方 Web 插件树叠加固定 Desktop Patch。Patch 插入七个 Desktop Loader 行，并重配 web-runtime。最终插件树增加桌面应用能力并改变 Web 启动行为，但 Agent Runtime、Session 和 Agent Preset 保持不变。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1f2937" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c75b52"/>
    </marker>
    <style>
      .canvas { fill: #f5f7f9; }
      .panel { fill: #ffffff; stroke: #d8dee6; stroke-width: 2; }
      .title { font: 700 34px Inter, "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #252b35; }
      .subtitle { font: 500 18px Inter, "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #667085; }
      .section-title { font: 700 24px Inter, "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #252b35; }
      .card-title { font: 700 20px Inter, "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #26303d; }
      .card-text { font: 500 17px Inter, "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #3f4a59; }
      .small { font: 500 15px Inter, "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #586474; }
      .tiny { font: 500 14px Inter, "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #667085; }
      .inverse { fill: #ffffff; }
      .official { fill: #e8f2f9; stroke: #78a9c5; stroke-width: 2; }
      .desktop { fill: #fbe8e5; stroke: #d87970; stroke-width: 2; }
      .desktop-strong { fill: #f4d0cb; stroke: #cf675e; stroke-width: 2; }
      .preserved { fill: #e4f4ef; stroke: #62a38e; stroke-width: 2; }
      .inner { fill: #ffffff; stroke: #e0a29c; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #4b5563; stroke-width: 3; marker-end: url(#arrow); }
      .desktop-arrow { fill: none; stroke: #c75b52; stroke-width: 3; marker-end: url(#arrow-coral); }
    </style>
  </defs>

  <rect class="canvas" width="1200" height="1000"/>
  <text class="title" x="600" y="48" text-anchor="middle">固定 Desktop Patch 主要修改什么</text>
  <text class="subtitle" x="600" y="80" text-anchor="middle">只展开 dsh-plugin-desktop/cordis.patch.yml</text>

  <g transform="translate(385 103)">
    <rect class="official" x="0" y="0" width="28" height="17" rx="5"/>
    <text class="small" x="38" y="14">官方继承</text>
    <rect class="desktop" x="155" y="0" width="28" height="17" rx="5"/>
    <text class="small" x="193" y="14">Patch 修改</text>
    <rect class="preserved" x="320" y="0" width="28" height="17" rx="5"/>
    <text class="small" x="358" y="14">保持不变</text>
  </g>

  <rect class="panel" x="60" y="145" width="1080" height="150" rx="20" filter="url(#shadow)"/>
  <text class="section-title" x="600" y="182" text-anchor="middle">起点：选中 Profile 的官方 Web Plugin Tree</text>
  <rect class="official" x="105" y="205" width="990" height="58" rx="14"/>
  <text class="card-title" x="600" y="231" text-anchor="middle">dsh-base + dsh-web-app</text>
  <text class="small" x="600" y="253" text-anchor="middle">Agent Runtime · Web Host · 官方 Client · agent-presets</text>

  <path class="desktop-arrow" d="M600 295 V344"/>
  <rect class="canvas" x="437" y="306" width="326" height="25" rx="12"/>
  <text class="small" x="600" y="324" text-anchor="middle">Desktop Launcher 在 dsh-web-app 后加载</text>

  <rect class="desktop-strong" x="60" y="355" width="1080" height="340" rx="20" filter="url(#shadow)"/>
  <text class="section-title" x="600" y="393" text-anchor="middle">固定 Desktop Patch</text>
  <text class="tiny" x="600" y="419" text-anchor="middle">两个动作：插入 Desktop Plugin，覆盖现有配置</text>

  <rect class="inner" x="95" y="445" width="620" height="215" rx="16"/>
  <text class="card-title" x="405" y="476" text-anchor="middle">① 插入 7 个 Desktop Loader 行</text>
  <line x1="405" y1="490" x2="405" y2="640" stroke="#ecd2cf" stroke-width="1.5"/>

  <text class="card-text" x="125" y="519">desktop-shell</text>
  <text class="small" x="277" y="519">窗口与生命周期</text>
  <text class="card-text" x="125" y="554">desktop-terminal</text>
  <text class="small" x="277" y="554">桌面终端</text>
  <text class="card-text" x="125" y="589">desktop-diagnostics</text>
  <text class="small" x="300" y="589">诊断导出</text>
  <text class="card-text" x="125" y="624">desktop-notifications</text>
  <text class="small" x="307" y="624">系统通知</text>

  <text class="card-text" x="435" y="519">desktop-pnpm</text>
  <text class="small" x="570" y="519">Profile 依赖操作</text>
  <text class="card-text" x="435" y="564">desktop-profiles</text>
  <text class="small" x="580" y="564">Profile 管理</text>
  <text class="card-text" x="435" y="609">desktop-updates</text>
  <text class="small" x="582" y="609">应用更新</text>

  <rect class="inner" x="745" y="445" width="360" height="215" rx="16"/>
  <text class="card-title" x="925" y="476" text-anchor="middle">② 重配 web-runtime</text>
  <text class="card-text" x="925" y="520" text-anchor="middle">openBrowser: false</text>
  <text class="card-text" x="925" y="553" text-anchor="middle">printUrl: false</text>
  <text class="card-text" x="925" y="586" text-anchor="middle">surfaceContext: true</text>
  <text class="card-text" x="925" y="619" text-anchor="middle">trustedHosts: []</text>
  <text class="tiny" x="925" y="646" text-anchor="middle">窗口交给 Electron，Client 接收桌面上下文</text>

  <path class="desktop-arrow" d="M600 695 V739"/>
  <rect class="canvas" x="515" y="706" width="170" height="24" rx="12"/>
  <text class="small" x="600" y="723" text-anchor="middle">叠加到最终插件树</text>

  <rect class="panel" x="60" y="750" width="1080" height="175" rx="20" filter="url(#shadow)"/>
  <text class="section-title" x="600" y="788" text-anchor="middle">结果：应用宿主增加桌面能力，Agent 平面保持不变</text>

  <rect class="desktop" x="95" y="812" width="465" height="82" rx="14"/>
  <text class="card-title" x="327" y="842" text-anchor="middle">改变：应用如何运行</text>
  <text class="small" x="327" y="868" text-anchor="middle">窗口 · 终端 · Profile · 诊断 · 通知 · 更新</text>
  <text class="tiny" x="327" y="888" text-anchor="middle">Web 不再自行打开浏览器或打印 URL</text>

  <rect class="preserved" x="590" y="812" width="515" height="82" rx="14"/>
  <text class="card-title" x="847" y="842" text-anchor="middle">不变：Agent 如何工作与恢复</text>
  <text class="small" x="847" y="868" text-anchor="middle">Agent Loop · LLM · Session Log · Tools · Approval</text>
  <text class="tiny" x="847" y="888" text-anchor="middle">Preset roster、内容、选择与 mount 语义不变</text>

  <rect x="225" y="946" width="750" height="42" rx="21" fill="#303640"/>
  <text class="card-text inverse" x="600" y="974" text-anchor="middle">Desktop Patch 增加桌面应用能力，不重写 Agent Runtime</text>
</svg>
