<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1420" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">DeepSeek Harness ACP Profile 逻辑视图</title>
  <desc id="desc">展示 ACP Profile 如何从 dsh-base 与 dsh-acp-app 生成标准 Agent Client Protocol stdio Runtime，以及自动化客户端如何创建、恢复、配置、驱动和独立关闭多个持久 Session Agent。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#182230" flood-opacity="0.08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#667085"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#2878C8"/></marker>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #182230; }
      .page-title { font-size: 34px; font-weight: 750; } .page-subtitle { font-size: 17px; fill: #667085; }
      .section-title { font-size: 21px; font-weight: 750; } .section-copy { font-size: 15px; fill: #667085; }
      .card-title { font-size: 20px; font-weight: 750; } .card-subtitle { font-size: 15px; font-weight: 650; }
      .copy { font-size: 14px; fill: #475467; } .small { font-size: 13px; fill: #667085; } .chip { font-size: 13px; font-weight: 700; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; } .inverse { fill: #FFFFFF; } .inverse-muted { fill: #DDE7F2; }
      .section { fill: #FFFFFF; stroke: #D8DEE8; stroke-width: 1.5; } .card { stroke-width: 1.4; }
      .edge { fill: none; stroke: #667085; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #2878C8; stroke-width: 2.4; marker-end: url(#arrow-blue); }
      .edge-back { fill: none; stroke: #8795A8; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .edge-label { font-size: 13px; font-weight: 650; fill: #667085; }
    </style>
  </defs>
  <rect width="1600" height="1420" fill="#F5F7FA"/>
  <text class="page-title" x="54" y="54">ACP Profile：标准自动化协议 Runtime</text>
  <text class="page-subtitle" x="54" y="84">ACP 客户端通过标准 JSON-RPC stdio 管理多个持久 Agent；每个 Session 拥有自己的 cwd、MCP 与模型配置。</text>

  <rect class="section" x="40" y="112" width="1520" height="300" rx="22"/>
  <rect x="64" y="134" width="188" height="34" rx="17" fill="#E8F1FC"/><text class="section-title" x="82" y="158" fill="#175EA8">1　启动装配</text>
  <text class="section-copy" x="275" y="157">dsh-base 提供完整 Harness，dsh-acp-app 增加标准 ACP Bridge</text>
  <rect class="card" x="72" y="190" width="260" height="158" rx="15" fill="#EAF3FF" stroke="#78AEE3" filter="url(#shadow)"/>
  <text class="card-title" x="94" y="222">ACP Profile</text><text class="copy" x="94" y="250">名称：<tspan class="mono" font-weight="700">acp</tspan></text>
  <text class="small mono" x="94" y="277">1. dsh-base</text><text class="small mono" x="94" y="299">2. dsh-acp-app</text>
  <rect x="94" y="313" width="154" height="24" rx="12" fill="#CFE5FA"/><text class="chip" x="171" y="330" text-anchor="middle" fill="#175EA8">Patch Reload: startup</text>
  <path class="edge-blue" d="M332 269 H380"/><text class="edge-label" x="356" y="252" text-anchor="middle">选择、排序</text>
  <rect class="card" x="388" y="190" width="422" height="158" rx="15" fill="#F8FAFC" stroke="#98A2B3" filter="url(#shadow)"/>
  <text class="card-title" x="410" y="222">Bundle Patch 层</text>
  <rect x="410" y="244" width="178" height="73" rx="12" fill="#EAF3FF" stroke="#78AEE3"/><text class="card-subtitle mono" x="428" y="272">① dsh-base</text><text class="small" x="428" y="297">完整产品 Runtime</text>
  <rect x="610" y="244" width="178" height="73" rx="12" fill="#E9F4FC" stroke="#5399CB"/><text class="card-subtitle mono" x="628" y="272">② dsh-acp-app</text><text class="small" x="628" y="297">Startup + ACP Bridge</text>
  <path class="edge-blue" d="M810 269 H860"/><text class="edge-label" x="835" y="252" text-anchor="middle">依次应用</text>
  <rect class="card" x="868" y="190" width="278" height="158" rx="15" fill="#FFF8E8" stroke="#D7A63F" filter="url(#shadow)"/>
  <text class="card-title" x="890" y="222">Loader 配置</text><text class="copy" x="890" y="251">base 行 + acp-app 行</text>
  <line x1="890" y1="268" x2="1124" y2="268" stroke="#E3C984"/><text class="small" x="890" y="292">默认 DeepSeek provider / model</text><text class="small" x="890" y="316">stdout 仅承载 ACP Frame</text>
  <path class="edge-blue" d="M1146 269 H1196"/><text class="edge-label" x="1171" y="252" text-anchor="middle">实例化</text>
  <rect class="card" x="1204" y="190" width="316" height="158" rx="15" fill="#344054" stroke="#344054" filter="url(#shadow)"/>
  <text class="card-title inverse" x="1226" y="223">ACP Runtime 进程</text><text class="copy inverse-muted" x="1226" y="252">标准 ACP v1 / JSON-RPC stdio</text>
  <line x1="1226" y1="269" x2="1498" y2="269" stroke="#667085"/><text class="small inverse" x="1226" y="294">面向编辑器、自动化与外部 Agent</text><text class="small inverse" x="1226" y="318">连接关闭时停稳并释放所持 Agent</text>
  <rect x="388" y="365" width="824" height="29" rx="14.5" fill="#F2F4F7"/><text class="small" x="800" y="385" text-anchor="middle">ACP 是标准自动化接口；DSH 专用 GUI 呈现和私有方法不进入该协议。</text>

  <rect class="section" x="40" y="440" width="1520" height="392" rx="22"/>
  <rect x="64" y="462" width="188" height="34" rx="17" fill="#E9F4FC"/><text class="section-title" x="82" y="486" fill="#266F9F">2　进程运行时</text>
  <text class="section-copy" x="275" y="485">ACP Bridge 在完整 dsh-base 上管理独立会话；没有 Agent Preset Roster</text>
  <rect x="72" y="518" width="1456" height="280" rx="18" fill="#FBFCFE" stroke="#98A2B3" stroke-width="1.6"/>
  <rect x="94" y="538" width="318" height="32" rx="16" fill="#344054"/><text class="chip inverse" x="253" y="560" text-anchor="middle">ACP Process · Cordis Root</text>
  <rect class="card" x="98" y="592" width="416" height="170" rx="15" fill="#EAF3FF" stroke="#78AEE3"/>
  <text class="card-title" x="118" y="625">dsh-base 完整 Runtime</text><text class="copy" x="118" y="654">LLM · Session/Persistence · Agent Loop</text><text class="copy" x="118" y="680">完整 Tools / Skills · Sandbox · Approval</text><text class="copy" x="118" y="706">Settings · Credentials · Telemetry · Compaction</text>
  <rect x="118" y="720" width="248" height="25" rx="12.5" fill="#CFE5FA"/><text class="chip" x="242" y="738" text-anchor="middle" fill="#175EA8">Agent 组合位于进程全局层</text>
  <path class="edge" d="M514 677 H558"/>
  <rect class="card" x="566" y="592" width="416" height="170" rx="15" fill="#E9F4FC" stroke="#5399CB"/>
  <text class="card-title" x="586" y="625">dsh-acp Bridge</text><text class="copy" x="586" y="654">标准方法与语义更新映射</text><text class="copy" x="586" y="680">创建 / 恢复 / 列出 / 关闭 Session</text><text class="copy" x="586" y="706">Prompt、Cancel、Permission、配置选择</text>
  <rect x="586" y="720" width="232" height="25" rx="12.5" fill="#D5EAF7"/><text class="chip" x="702" y="738" text-anchor="middle" fill="#266F9F">stdout 只允许协议帧</text>
  <path class="edge" d="M982 677 H1026"/>
  <rect class="card" x="1034" y="592" width="468" height="170" rx="15" fill="#F6FEF9" stroke="#60B985"/>
  <text class="card-title" x="1054" y="625">多 Session Agent 管理</text><text class="copy" x="1054" y="654">一个连接可以并发运行多个会话</text><text class="copy" x="1054" y="680">每个 Session 独立持有 Agent、MCP 与更新链</text><text class="copy" x="1054" y="706">关闭一个 Session 不影响其他 Session</text>
  <rect x="1054" y="720" width="244" height="25" rx="12.5" fill="#D9F2E3"/><text class="chip" x="1176" y="738" text-anchor="middle" fill="#167047">没有 dsh-agent-presets</text>

  <rect class="section" x="40" y="860" width="1520" height="476" rx="22"/>
  <rect x="64" y="882" width="188" height="34" rx="17" fill="#E8F7F2"/><text class="section-title" x="82" y="906" fill="#16785E">3　标准自动化流</text>
  <text class="section-copy" x="275" y="905">客户端拥有会话生命周期；每个 session/new 提供绝对 cwd，并可挂载自己的 MCP</text>
  <rect class="card" x="78" y="958" width="300" height="210" rx="16" fill="#EAF3FF" stroke="#78AEE3" filter="url(#shadow)"/>
  <text class="card-title" x="100" y="992">ACP Client</text><text class="copy" x="100" y="1021">编辑器 · 自动化系统 · 外部 Agent</text><text class="copy" x="100" y="1047">initialize / session/new / resume</text><text class="copy" x="100" y="1073">prompt / cancel / close</text><text class="copy" x="100" y="1099">set_config_option / permission</text>
  <line x1="100" y1="1118" x2="356" y2="1118" stroke="#B6D2ED"/><text class="small" x="100" y="1143">接收标准 session/update</text>
  <path class="edge-blue" d="M378 1047 H442"/><text class="edge-label" x="410" y="1030" text-anchor="middle">stdio 请求</text>
  <path class="edge-back" d="M442 1102 H386"/><text class="edge-label" x="414" y="1122" text-anchor="middle">更新</text>
  <rect class="card" x="450" y="958" width="330" height="210" rx="16" fill="#E9F4FC" stroke="#5399CB" filter="url(#shadow)"/>
  <text class="card-title" x="472" y="992">ACP Bridge</text><text class="copy" x="472" y="1021">校验 workspace、MCP 与内容</text><text class="copy" x="472" y="1047">创建或恢复持久 Agent</text><text class="copy" x="472" y="1073">串行交付每个 Session 的更新</text><text class="copy" x="472" y="1099">停稳后结算 prompt / close</text>
  <line x1="472" y1="1118" x2="758" y2="1118" stroke="#BBD8EB"/><text class="small" x="472" y="1143">标准 ACP 语义，不发送 DSH 私有卡片</text>
  <path d="M780 1058 H816 V922 H1340" fill="none" stroke="#2878C8" stroke-width="2.4"/>
  <path class="edge-blue" d="M1002 922 V932"/><path class="edge-blue" d="M1340 922 V932"/>
  <rect x="1040" y="910" width="164" height="24" rx="12" fill="#FFFFFF"/><text class="edge-label" x="1122" y="927" text-anchor="middle">按 Session 独立管理</text>
  <rect class="card" x="852" y="940" width="300" height="228" rx="16" fill="#F6FEF9" stroke="#60B985" filter="url(#shadow)"/>
  <text class="card-title" x="874" y="974">Session A · Agent A</text><text class="copy" x="874" y="1003">cwd A · MCP Set A</text><text class="copy" x="874" y="1029">model / reasoning A</text><text class="copy" x="874" y="1055">Session Log A · Update Queue A</text>
  <line x1="874" y1="1074" x2="1130" y2="1074" stroke="#BFE4CF"/><text class="small" x="874" y="1099">session/close 只释放本会话</text><rect x="874" y="1120" width="198" height="25" rx="12.5" fill="#D9F2E3"/><text class="chip" x="973" y="1138" text-anchor="middle" fill="#167047">可跨进程列出与恢复</text>
  <rect class="card" x="1190" y="940" width="300" height="228" rx="16" fill="#F6FEF9" stroke="#60B985" filter="url(#shadow)"/>
  <text class="card-title" x="1212" y="974">Session B · Agent B</text><text class="copy" x="1212" y="1003">cwd B · MCP Set B</text><text class="copy" x="1212" y="1029">model / reasoning B</text><text class="copy" x="1212" y="1055">Session Log B · Update Queue B</text>
  <line x1="1212" y1="1074" x2="1468" y2="1074" stroke="#BFE4CF"/><text class="small" x="1212" y="1099">与 Session A 独立并发运行</text><rect x="1212" y="1120" width="198" height="25" rx="12.5" fill="#D9F2E3"/><text class="chip" x="1311" y="1138" text-anchor="middle" fill="#167047">可单独取消和关闭</text>
  <rect x="264" y="1210" width="1072" height="78" rx="18" fill="#F2F4F7"/>
  <text class="card-subtitle" x="800" y="1240" text-anchor="middle">生命周期结论</text>
  <text class="copy" x="800" y="1267" text-anchor="middle">ACP Profile 定义标准自动化服务器进程；ACP Client 显式拥有每个 Session Agent 的创建、配置、工作与关闭。</text>
  <rect x="340" y="1362" width="920" height="34" rx="17" fill="#FFFFFF" stroke="#D8DEE8"/>
  <circle cx="382" cy="1379" r="7" fill="#78AEE3"/><text class="small" x="397" y="1384">装配</text><circle cx="502" cy="1379" r="7" fill="#5399CB"/><text class="small" x="517" y="1384">ACP 协议</text><circle cx="645" cy="1379" r="7" fill="#60B985"/><text class="small" x="660" y="1384">Session Agent</text><text class="small" x="850" y="1384">核心关系：</text><text class="chip" x="920" y="1384">一个连接 → 多个独立生命周期 Session</text>
</svg>
